<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pomofocus -Login</title>
    <link rel="icon" type="image/png" href="icons/icon-white2.png" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/login.css" />
  </head>
  <body class="login-body">
    <main class="login-wrapper">
      <a href="index.html" class="login-brand">
        <img
          src="icons/icon-white2.png"
          alt="pomofocus icon"
          class="login-logo-img"
        />
        <h1 class="login-logo-text">Pomofocus</h1>
      </a>

      <section class="login-card" aria-labelledby="loginHeading">
        <h2 id="loginHeading" class="visually-hidden">Log in</h2>
        <form id="loginForm">
          <div class="form-group">
            <label for="emailInput" class="login-label">EMAIL</label>
            <input
              type="email"
              id="emailInput"
              class="login-input"
              placeholder="example: thanhnguyen@gmail.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="passwordInput" class="login-label">PASSWORD</label>
            <input
              type="password"
              id="passwordInput"
              autocomplete="current-password"
              class="login-input"
              required
            />
          </div>

          <button type="submit" class="login-btn-submit">Log in</button>
        </form>
      </section>
    </main>
    <script type="module" src="js/login.js"></script>
  </body>
</html>
